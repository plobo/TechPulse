name: TechPulseAI
options:
  bundleIdPrefix: com.techpulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TechPulseAI:
    type: application
    platform: iOS
    sources:
      - path: TechPulseAI
    info:
      path: TechPulseAI/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Release builds: set the TECHPULSE_API_BASE_URL build setting (HTTPS) to use a backend.
        TECHPULSE_API_BASE_URL: $(TECHPULSE_API_BASE_URL)
        NSAppTransportSecurity:
          # Allows plain HTTP only to local addresses (simulator → local server). Internet traffic still needs HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      base:
        TECHPULSE_API_BASE_URL: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.techpulse.ai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TechPulse AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # FoundationModels is iOS 26+; weak-link so the app still launches on iOS 17–18.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
  TechPulseAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TechPulseAITests
    dependencies:
      - target: TechPulseAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.techpulse.ai.tests
  TechPulseAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TechPulseAIUITests
    dependencies:
      - target: TechPulseAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.techpulse.ai.uitests
        TEST_TARGET_NAME: TechPulseAI
schemes:
  TechPulseAI:
    build:
      targets:
        TechPulseAI: all
        TechPulseAITests: [test]
        TechPulseAIUITests: [test]
    test:
      targets:
        - TechPulseAITests
        - TechPulseAIUITests
      gatherCoverageData: true
      # Own environment so tests don't inherit the Run action's local-server URL (CI has no server).
      environmentVariables:
        TECHPULSE_TESTS: "1"
    run:
      config: Debug
      # Local TechPulse Server (docker compose up / npm run dev). Debug-only: http is allowed for localhost.
      # Remove or change this to use sample data or a hosted HTTPS server.
      environmentVariables:
        TECHPULSE_API_BASE_URL: http://localhost:8080
