name: iOS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick or create an iPhone simulator
        id: sim
        run: |
          # Runner images vary; don't hard-code a device name.
          pick() {
            xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(ids[0] if ids else '')"
          }
          runtime() {
            xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; print(r[-1] if r else '')"
          }
          UDID=$(pick)
          if [ -z "$UDID" ]; then
            RT=$(runtime)
            if [ -z "$RT" ]; then xcodebuild -downloadPlatform iOS; RT=$(runtime); fi
            UDID=$(xcrun simctl create ci-iphone com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RT")
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          xcodebuild test -project TechPulseAI.xcodeproj -scheme TechPulseAI \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:TechPulseAITests CODE_SIGNING_ALLOWED=NO
